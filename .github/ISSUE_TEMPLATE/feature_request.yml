name: 功能建议 / Feature request
description: 新的快速路径技巧、参考案例、测速方法或体验改进
labels: ["needs-triage", "source:github", "type:feature"]
body:
  - type: markdown
    attributes:
      value: |
        提交后 Agent 会自动评估可行性。注意本项目的边界：浏览器读写只通过 Computer Use（不用 Playwright、CDP、DOM 注入、浏览器插件）；不绕过登录、验证码、安全警告、权限提示和风控；不读取或代填凭据；不为提速跳过发布、上传、删除、购买等操作前的确认；最终结果必须在界面上核验；没有可复现测速不写提速倍数。
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题
      description: 你在做哪类浏览器流程时，哪一步慢或不稳（观察轮次多、重复截图、批量时反复出错……）。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的做法
      description: 理想中的指引、案例或脚本行为；有测速数据的话按 references/benchmark.md 的字段附上。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 目前的替代办法
